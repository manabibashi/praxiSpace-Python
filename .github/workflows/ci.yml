name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Syntax check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile all Python files
        run: |
          mapfile -t files < <(find . -name "*.py" | sort)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No .py files found - the syntax check would silently pass."
            exit 1
          fi
          printf 'Checking %d file(s):\n' "${#files[@]}"
          printf '  %s\n' "${files[@]}"
          python -m py_compile "${files[@]}"

  required-check:
    name: required-check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs: [test]
    steps:
      - name: Verify that all jobs succeeded
        run: |
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "test job did not succeed: ${{ needs.test.result }}"
            exit 1
          fi
