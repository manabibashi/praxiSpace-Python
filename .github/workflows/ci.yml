# 共通 CI(manabibashi/workflows)の呼び出し。実体は同リポジトリの .github/workflows/ci.yml。
# ジョブ ID「ci」は変更禁止(必須チェック名「ci / required-check」を全リポジトリで揃えるため)。
#
# 教材リポジトリのため packaging(uv / pyproject)は持ち込まない。runtime: none とし、
# ubuntu ランナーの system python で構文チェックだけを回す(Issue #4 の方針)。

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: manabibashi/workflows/.github/workflows/ci.yml@v1
    with:
      runtime: none
      test-command: python3 -m compileall .
    secrets: inherit
